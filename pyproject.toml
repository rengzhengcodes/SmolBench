# Use setuptools as the build backend so the project can be installed with
# standard Python tooling without adding another packaging dependency.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Keep the distribution name aligned with the import package directory.
name = "smolbench"

# No release process exists in the repository yet, so use a simple manual
# version for now.
version = "0.1.0"

# Mirror the repository README at a high level.
description = "A benchmark for smol manipulation of language."
readme = "README.md"

# The main development venv (.venv) runs Python 3.14. The floor is 3.12 --
# claimed solely so the Lean theorem-proving verification path can share this
# package: lean-dojo (the `lean` extra) pins Requires-Python <3.13 upstream,
# so smolbench.deduction.lean.verify runs from a dedicated 3.12 venv (.venv-lean; see
# notebooks/deduction/README.md). All smolbench code is validated on both 3.12 and
# 3.14 by the offline test suite.
requires-python = ">=3.12"

# These are the direct runtime dependencies observed from the repository's
# import graph and confirmed by the `smolbench` pyenv `pip freeze`.
# They are expressed as lower bounds at the currently installed versions,
# meaning "known working here" rather than "minimum version ever supported".
dependencies = [
    "joblib>=1.0",
    "numpy>=2.4.3",
    # smolbench.induction uses OrderedSet for deterministic, order-preserving sets.
    "ordered-set>=4.1.0",
    "requests>=2.33.1",
    # smolbench.evals.tokenization loads the tokenizer of the model under test
    # (its `tokenizer.json` off the HF hub) so smolbench.induction can pad its
    # noise arm to an exact TOKEN count. Core, not optional: without a
    # tokenizer the induction benchmarks cannot build one of their three
    # conditions. Deliberately NOT `transformers` -- one file and the Rust BPE
    # that reads it, no modeling stack and no torch.
    "huggingface-hub>=0.30",
    "tokenizers>=0.20",
]

[project.optional-dependencies]
# The active pyenv also contains formatting and linting tools. They are useful
# for development, but they are not required to import or run the package.
dev = [
    "black>=26.3.1",
    "isort>=8.0.1",
    "pylint>=4.0.5",
    # Offline test suite under tests/ (stub-server provider round trips,
    # golden quiz regressions, ec2 payload checks) -- no AWS creds needed.
    "pytest>=8.0",
    # tests/evals/test_dsv4_chat_template.py renders the inline DeepSeek-V4 serving
    # template and byte-compares it against the vendored shipped encoding; the
    # pin must RUN (not importorskip away) in both venvs.
    "jinja2>=3.1",
]

# AWS lifecycle paths: SageMaker endpoint provisioning + token minting in
# smolbench/evals/providers/aws.py and EC2 spot provisioning in smolbench/evals/providers/ec2.py.
# Both modules import these lazily, so plain inference through either
# provider needs neither package; only provision/teardown/minting does. A
# named extra keeps that dependency import-testable without dragging in
# notebook UI tooling.
aws = [
    "botocore>=1.35.0",
    "boto3>=1.43",
]

# Lean theorem-proving eval (smolbench/deduction/lean/): corpus/context/prompt rendering
# and the sweep runner need PyYAML (configs, results) and tiktoken (noise-rung
# token matching, prompt-stats; also backs the optional
# smolbench.evals.tokenization.TiktokenTokenizer, which the offline tests and
# the module demos use in place of a downloaded model tokenizer);
# verification additionally needs lean-dojo,
# which pins Requires-Python <3.13 upstream -- the environment marker lets
# `uv sync --all-extras` succeed on the 3.14 main venv (generation/analysis
# modules import cleanly there) while the dedicated 3.12 venv (.venv-lean)
# gets the full verification stack.
lean = [
    "lean-dojo>=2.0; python_version < '3.13'",
    "PyYAML>=6.0.3",
    # 0.13 is the first release shipping both cp312 and cp314 wheels.
    "tiktoken>=0.13",
]

# The repository now includes a checked-in notebook under `notebooks/`.
# The active `smolbench` pyenv uses VS Code/Jupyter kernel support via
# `ipykernel`, so expose that as a separate extra without pulling in a full
# notebook server stack that is not currently part of the environment.
notebook = [
    "ipykernel>=7.2.0",
    # Runtime libraries the checked-in notebooks import directly:
    #   - PyYAML (`import yaml`) backs Marks.dump/Marks.load result
    #     serialization. Pinned to a version with cp314 wheels so it installs
    #     without libyaml.
    #   - python-dotenv (`import dotenv`) loads provider keys from keys.env.
    "PyYAML>=6.0.3",
    "python-dotenv>=1.0.1",
    # The notebooks provision AWS infrastructure (EC2 spot / SageMaker).
    "smolbench[aws]",
    # smolbench.induction.figures plots results with matplotlib; pinned to a
    # cp314-wheel release.
    "matplotlib>=3.10.0",
    # The two power-analysis scripts (notebooks/{induction,deduction}/
    # power_analysis.py) import scipy.stats for the CMH chi-square / Welch t
    # reference distributions, and notebooks/induction additionally imports
    # statsmodels for the omnibus interaction test. Both were previously undeclared, so `uv sync`
    # would silently strip them and leave those scripts failing on
    # ModuleNotFoundError partway through a run.
    "scipy>=1.15",
    "statsmodels>=0.14",
]

[tool.setuptools]
# This project is pure Python and ships only the package source under
# `smolbench/` (plus the explicitly listed payload assets below).
include-package-data = false

[tool.setuptools.package-data]
# Byte-exact on-instance payloads (cloud-init templates + the py3.10 control
# agent/watchdog) shipped as data files inside the payloads subpackage.
# setuptools auto-includes only *.py, so without this a non-editable install
# would drop them and smolbench.evals.payloads would fail at import. The
# non-.py extensions are deliberate: they keep black/isort/pylint and the
# import machinery away from files whose bytes are a production contract.
"smolbench.evals.payloads" = ["*.sh", "*.py.txt"]

[tool.setuptools.packages.find]
# Pick up the top-level package and any subpackages below it.
where = ["."]
include = ["smolbench*"]

[tool.pytest.ini_options]
# A bare `pytest` invoked from the repo root previously failed: tests import
# `tests._paths` and `tests.conftest`, which need the repo root on
# sys.path, and pytest's default rootdir-insertion doesn't guarantee that
# without a tests/__init__.py (deliberately not added -- see tests/README.md).
testpaths = ["tests"]
pythonpath = ["."]
