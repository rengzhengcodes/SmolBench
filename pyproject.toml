[project]
name = "smolbench"
version = "0.0.1"
description = "A benchmark for evaluating how representations of positive utility information in context impact LLM performance."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "lean-dojo",
    "openai",
    "transformers",
]

[project.optional-dependencies]
gpu = [
    "vllm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["induction"]
