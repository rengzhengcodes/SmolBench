# Use setuptools as the build backend so the project can be installed with
# standard Python tooling without adding another packaging dependency.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Keep the distribution name aligned with the import package directory.
name = "smolbench"

version = "0.1.0"

# Mirror the repository README at a high level.
description = "A benchmark for smol manipulation of language."
readme = "README.md"

# Python 3.12, the interpreter the experiments ran on.
requires-python = ">=3.12,<3.13"

# Direct runtime dependencies, expressed as lower bounds at the versions
# known to work here rather than the minimum ever supported.
dependencies = [
    # Horn and induction analyses use NumPy.
    "numpy>=2.4.3",
    # Horn figures and induction confidence intervals.
    "matplotlib>=3.9",
    "scipy>=1.15",
    # Horn prompt rendering counts cl100k tokens.
    "tiktoken>=0.13",
    # Induction results are read as YAML.
    "PyYAML>=6.0.3",
    # Public released results are fetched anonymously from S3.
    "boto3>=1.43",
    "botocore>=1.35.0",
]

[project.optional-dependencies]
# The active pyenv also contains formatting and linting tools. They are useful
# for development, but they are not required to import or run the package.
dev = [
    "black>=26.3.1",
    "isort>=8.0.1",
    "pylint>=4.0.5",
    # Test suite for the analysis and result-reproduction code.
    "pytest>=8.0",
]

[tool.uv]
# Resolve and lock for Linux only. This keeps uv.lock small and
# reviewable: without it uv also locks win32/emscripten resolution forks and
# every platform's wheels for every package.
environments = ["sys_platform == 'linux'"]

[tool.setuptools]
# This project is pure Python and ships only the package source under
# `smolbench/` (plus the explicitly listed protocol records below).
include-package-data = false

[tool.setuptools.package-data]
# iclr.json records the result protocols read by their repro modules.
"smolbench.deduction.horn" = ["*.json"]
"smolbench.induction" = ["*.json"]

[tool.setuptools.packages.find]
# Pick up the top-level package and any subpackages below it.
where = ["."]
include = ["smolbench*"]

[tool.pytest.ini_options]
# The repo root on sys.path supports imports from the package and notebooks.
# `testpaths` lets pytest collect the suite from the repo root.
testpaths = ["tests"]
pythonpath = ["."]
